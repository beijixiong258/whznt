server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: whznt
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/whznt
    username: whznt
    password: whznt-local-dev
  mvc:
    async:
      request-timeout: 185s
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 516MB
  task:
    scheduling:
      pool:
        size: 2
  ai:
    openai:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
whznt:
  storage-dir: "${LOCALAPPDATA:${user.home}}/whznt/data"
