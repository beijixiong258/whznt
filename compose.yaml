name: whznt
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whznt
      POSTGRES_USER: whznt
      POSTGRES_PASSWORD: "whznt-local-dev"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whznt -d whznt"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
